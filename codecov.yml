ignore:
# Test code is deliberately counted in coverage. Seeing which test lines ran
# shows a test that is skipped, never reaches its assertions, or doesn't run
# at all, so don't ignore tests/ to raise the patch or project numbers.
# Only test-tree code that PHPUnit never runs belongs in this list.
#
# claimrevolution/oe-module-claimrev-connect is a Composer dependency relocated
# into this path by the oe-module-installer-plugin during `composer install`.
# Third-party code, not maintained in this repo — exclude from coverage.
- interface/modules/custom_modules/oe-module-claimrev-connect/
- config/                              # Container/service configuration — not directly testable
- tests/PHPStan/                       # Static analysis rules — not exercised by PHPUnit
- tests/Rector/                        # Rector rules — run outside PHPUnit coverage
- tests/eventdispatcher/               # Example modules for documentation
- portal/messaging/messages.php        # Entry-point script (bootstrap + render) — exercised by manual QA, not unit tests
- portal/messaging/handle_note.php     # Entry-point script (CSRF, ACL, sendMail) — testable logic extracted to OpenEMR\Services\PortalMessagingSender

# Strip environment-specific path prefixes from coverage reports so Codecov
# can match them to repository files. See https://docs.codecov.com/docs/fixing-paths
fixes:
- '/var/www/localhost/htdocs/openemr/::'     # Apache Docker container
- '/usr/share/nginx/html/openemr/::'         # nginx Docker container
- '/home/runner/work/openemr/openemr/::'     # GitHub Actions runner (isolated tests)

coverage:
  status:
    project:
      default:
        target: auto      # Use current coverage as floor — no regression allowed (was 4%)
        threshold: 1%     # Allow 1% fluctuation for test-unrelated changes
    patch:
      default:
        target: 50%       # New code must have at least 50% coverage (was 0%)
        threshold: 5%     # Flexibility for config/migration/generated files

# Carry forward coverage for flags not uploaded on a given commit.
# PRs and pushes to master each collect coverage from a single config;
# the nightly scheduled run uploads all configs to master HEAD (which
# config each event uses is set by enable_coverage in
# .github/workflows/test-all.yml). Without carryforward,
# codecov/project compares a single-config head total against a
# full-matrix base total and reports a phantom drop.
# Each CI config must upload under its own flag: a fresh upload replaces
# everything carried forward under that flag, so configs sharing a flag
# overwrite each other's coverage instead of adding to it.
flag_management:
  default_rules:
    carryforward: true
  # Retired flags: no CI config uploads these any more, so without this they
  # would be carried forward indefinitely and keep stale coverage in every
  # total. Codecov keeps their history (flags are only soft-deleted).
  individual_flags:
