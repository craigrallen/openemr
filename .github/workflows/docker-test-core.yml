name: OpenEMR Docker Test Core

on:
  workflow_call:
    inputs:
      is_production_docker:
        required: true
        type: boolean
      alpine_version:
        required: false
        type: string
      php_versions:
        required: false
        type: string
      is_flex_coverage_docker:
        required: false
        type: boolean
        default: false
      flex_coverage_php_version:
        required: false
        type: string
      production_coverage_openemr_version:
        required: false
        type: string
      flex_timing:
        required: false
        type: boolean
        default: false

jobs:
  collect-production-targets:
    name: "Discover Production Docker Targets"
    if: ${{ inputs.is_production_docker }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Collect OpenEMR Prod Dockerfiles
      id: docker-dirs
      ##
      # Parse out the test parameters from subdirectories of docker/
      # that hold a Dockerfile. Skips development-* dirs (those carry
      # docker-compose.yml, not a top-level Dockerfile).
      # Use that output as a test matrix in github actions.
      #
      # DEDICATED_LANES (fork-local): images whose contract the generic
      # test-actions-core pipeline cannot exercise, each verified by its own
      # job below instead. docker/railway builds this checkout from the
      # repository root (not docker/railway) and refuses the upstream default
      # credentials, MANUAL_SETUP and an unmounted sites/ that the generic
      # InstallerAuto path relies on; it runs in railway-test. Every entry
      # must have such a job: tests/Tests/Isolated/Ci/
      # DockerTestCoreRailwayLaneIsolatedTest.php enforces it.
      env:
        DEDICATED_LANES: railway
      run: |
        shopt -s nullglob
        dirs=()
        for f in docker/*/Dockerfile; do
          d=${f%/Dockerfile}
          [ -L "$d" ] && continue
          case " ${DEDICATED_LANES} " in
            *" ${d#docker/} "*)
              echo "::notice::${d} is verified by its dedicated job, not the generic matrix"
              continue
              ;;
          esac
          dirs+=( "$d" )
        done
        if (( "${#dirs[@]}" == 0 )); then
          echo 'No Dockerfiles found in docker/ subdirectories.' >&2
          exit 1
        fi
        dirs=( "${dirs[@]#docker/}" )
        # Use jq to ensure that the output is valid JSON or fail trying.
        # The output (after '=') must be valid JSON for GitHub Actions to use it as a matrix.
        {
          printf 'docker_dirs='
          printf '"%s"\n' "${dirs[@]}" | jq -sc '.'
        } >> "$GITHUB_OUTPUT"
    - name: Validate production_coverage_openemr_version is a discovered target
      # Fail fast if the caller asked for kcov instrumentation on a variant
      # the matrix never builds. Without this, the kcov profile is silently
      # disabled (every docker_dir != coverage_variant) and the whole run
      # passes with zero coverage uploaded -- the exact silent regression
      # the cross-branch review caught when the value drifted to a tag that
      # doesn't exist under the openemr core layout.
      if: ${{ inputs.production_coverage_openemr_version != '' }}
      env:
        COVERAGE_VARIANT: ${{ inputs.production_coverage_openemr_version }}
        DOCKER_DIRS: ${{ steps.docker-dirs.outputs.docker_dirs }}
      run: |
        if ! printf '%s\n' "$DOCKER_DIRS" | jq -e --arg t "$COVERAGE_VARIANT" 'index($t)' >/dev/null; then
          echo "::error::production_coverage_openemr_version='${COVERAGE_VARIANT}' is not in the discovered docker_dirs: ${DOCKER_DIRS}"
          exit 1
        fi
        echo "✓ production_coverage_openemr_version='${COVERAGE_VARIANT}' is in the discovered docker_dirs"
    outputs:
      docker_dirs: ${{ steps.docker-dirs.outputs.docker_dirs }}

  production-test:
    name: "Production Docker (${{ matrix.docker_dir }})"
    needs: [collect-production-targets]
    if: ${{ inputs.is_production_docker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        docker_dir: ${{ fromJSON(needs.collect-production-targets.outputs.docker_dirs) }}
    env:
      COMPOSE_PROFILES: ${{ inputs.production_coverage_openemr_version && matrix.docker_dir == inputs.production_coverage_openemr_version && 'kcov' || 'prod' }}
      DOCKER_CONTEXT_PATH: ${{ matrix.docker_dir }}
      OPENEMR_SERVICE_NAME: ${{ inputs.production_coverage_openemr_version && matrix.docker_dir == inputs.production_coverage_openemr_version && 'openemr-kcov' || 'openemr' }}
      COMPOSE_BAKE: "1"
      DOCKER_BUILDKIT: "1"
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/test-actions-core
      with:
        is_production_docker: ${{ inputs.is_production_docker }}
        # The binary image does not test this checkout: it runs the released
        # v${OPENEMR_VERSION} PHAR, with tests/ and phpunit*.xml cloned from
        # that same tag (see docker/binary/Dockerfile). Only this filter comes
        # from the PR, so it has to match what that release does, not what
        # the branch does.
        #
        # That release ships ccdaservice's source but never installs its
        # dependencies, so everything that shells out to that service fails
        # there: CCDA validation and generation cannot reach the
        # schematron/ccda service on port 6662, and QRDA cannot find
        # oe-cqm-parsers' measure JSON. Release installs those deps in its
        # Dockerfile and flex does it at container start, so both must keep
        # running these tests -- weakening the assertions for everybody
        # would hide a real gap. That gap is tracked in openemr/openemr#13851.
        #
        # CdaValidateDocumentsTest can come off this list once the pinned
        # binary release includes the pure-PHP schematron validator, which
        # no longer needs Node. Until then it would test the old Node path.
        # These all live in tests/Tests/Services, hence the services
        # suite rather than the unit one.
        services_exclude_filter: >-
          ${{ matrix.docker_dir == 'binary'
          && 'CdaValidateDocumentsTest|QrdaReportServiceTest|CcdaGeneratorTest|CcdaServiceDocumentRequestorTest'
          || '' }}

  # Fork-local lane for the Railway test-server image (TEST USE ONLY; see
  # docker/railway/README.md). Its contract differs from binary/flex/release
  # on purpose, so it is not run through test-actions-core:
  #   - it builds this checkout with the repository root as context;
  #   - it refuses missing/default credentials, MANUAL_SETUP=yes and an
  #     unmounted sites/ before upstream openemr.sh runs, so the public
  #     InstallerAuto step (rootpass=root, admin/pass) must fail by design;
  #   - Apache only starts after the mail/SMS/payment safety globals are
  #     written and read back, behind a PHP-level egress guard.
  # The application code itself is the same checkout the release variant
  # builds and runs the full unit/fixtures/services/validators/controllers/
  # common suites against above; this job verifies the Railway image.
  # acceptance-test.sh builds the image from the export-ignore-filtered git
  # archive Railway fetches, then runs it against a throwaway MariaDB with a
  # disposable named volume and per-run random credentials (masked in the
  # log): real-image refusals, readiness gating, locked installer/setup
  # routes behind the HTTP boundary, web egress guard, safety-global
  # read-back and drift detection, admin login, secret-free logs, source
  # revision read-back, and a container replacement with a schema migration.
  # Nothing here talks to Railway or uses real credentials.
  railway-test:
    name: "Production Docker (railway)"
    needs: [collect-production-targets]
    if: ${{ inputs.is_production_docker }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Railway image acceptance (build + ephemeral runtime)
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        head=$(git rev-parse HEAD)
        if [ "${head}" != "${EXPECTED_SHA}" ]; then
          echo "::error::checkout is ${head}, expected ${EXPECTED_SHA}"
          exit 1
        fi
        docker/railway/acceptance-test.sh

  development-test:
    name: "Development Docker Alpine-${{ inputs.alpine_version }} (PHP ${{ matrix.php_version }}, ${{ matrix.mode }})"
    if: ${{ !inputs.is_production_docker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ fromJSON(inputs.php_versions) }}
        mode: ['prod', 'dev']
    env:
      COMPOSE_PROFILES: ${{ matrix.mode == 'dev' && (inputs.is_flex_coverage_docker && matrix.php_version == inputs.flex_coverage_php_version && 'kcov-dev' || 'dev') || (inputs.is_flex_coverage_docker && matrix.php_version == inputs.flex_coverage_php_version && 'kcov' || 'prod') }}
      DOCKER_CONTEXT_PATH: "flex"
      OPENEMR_SERVICE_NAME: ${{ matrix.mode == 'dev' && (inputs.is_flex_coverage_docker && matrix.php_version == inputs.flex_coverage_php_version && 'openemr-kcov-dev' || 'openemr-dev') || (inputs.is_flex_coverage_docker && matrix.php_version == inputs.flex_coverage_php_version && 'openemr-kcov' || 'openemr') }}
      COMPOSE_BAKE: "1"
      DOCKER_BUILDKIT: "1"
      # Surfaces phase timing in openemr.sh — see openemr-devops#797.
      OPENEMR_FLEX_TIMING: ${{ inputs.flex_timing && '1' || '' }}
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/test-actions-core
      with:
        is_production_docker: ${{ inputs.is_production_docker }}
        alpine_version: ${{ inputs.alpine_version }}
        php_version: ${{ matrix.php_version }}
