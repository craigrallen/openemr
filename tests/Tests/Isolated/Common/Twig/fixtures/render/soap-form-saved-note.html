<html>
<head>
<title>SOAP</title>
    <!-- setupHeader stub -->
    <link rel="stylesheet" href="/openemr/interface/clinical-workspace/workspace.css?v=82">
    <script src="/openemr/interface/clinical-workspace/mode.js?v=82" defer></script>
    <link rel="stylesheet" href="/openemr/interface/clinical-workspace/soap-document.css?v=1700000789">
    <script src="/openemr/interface/clinical-workspace/soap-document.js?v=1700000790" defer></script>
    <link rel="stylesheet" href="/openemr/interface/clinical-workspace/soap-reference.css?v=1700000791">
    <script src="/openemr/interface/clinical-workspace/soap-reference.js?v=1700000792" defer></script>
</head>
<body class="oe-clinical-soap">
    <div class="container mt-3 oe-soap-document" spellcheck="true">
        <div class="row">
            <div class="col-12 col-lg-8">
                <h2>SOAP</h2>
                <form name="soap" method="post" action="/openemr/interface/forms/soap/save.php" onsubmit="return top.restoreSession()">
                    <input type="hidden" name="csrf_token_form" value="test-csrf-token" />
                    <fieldset>
                        <legend id="soap-subjective-label">Subjective</legend>
                        <div class="container">
                            <div class="form-group" >
                                <textarea name="subjective" id="soap-subjective" aria-labelledby="soap-subjective-label" class="form-control" cols="60" rows="6" onkeyup="top.isSoapEdit = true;" oninput="top.isSoapEdit = true;">  pt reports &lt;b&gt;pain&lt;/b&gt; &amp; "fatigue"

  since Monday  </textarea>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend id="soap-objective-label">Objective</legend>
                        <div class="container">
                            <div class="form-group">
                                <textarea name="objective" id="soap-objective" aria-labelledby="soap-objective-label" class="form-control" cols="60" rows="6" onkeyup="top.isSoapEdit = true;" oninput="top.isSoapEdit = true;">	BP 120/80</textarea>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend id="soap-assessment-label">Assessment</legend>
                        <div class="container">
                            <div class="form-group">
                                <textarea name="assessment" id="soap-assessment" aria-labelledby="soap-assessment-label" class="form-control" cols="60" rows="6" onkeyup="top.isSoapEdit = true;" oninput="top.isSoapEdit = true;"></textarea>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend id="soap-plan-label">Plan</legend>
                        <div class="container">
                            <div class="form-group">
                                <textarea name="plan" id="soap-plan" aria-labelledby="soap-plan-label" class="form-control" cols="60" rows="6" onkeyup="top.isSoapEdit = true;" oninput="top.isSoapEdit = true;">line one
line two</textarea>
                            </div>
                        </div>
                    </fieldset>
                    <div class="form-group">
                        <div class="btn-group" role="group">
                            <button type="submit" class="btn btn-primary btn-save" name="Submit">Save</button>
                            <button type="button" class="btn btn-secondary btn-cancel" id="btnClose">Cancel</button>
                        </div>
                        <input type="hidden" name="id" value="12" />
                        <input type="hidden" name="activity" value="1" />
                        <input type="hidden" name="pid" value="7" />
                        <input type="hidden" name="process" value="true" />
                    </div>
                </form>
            </div>
            <aside class="col-12 col-lg-4 oe-soap-reference" aria-label="Previous SOAP notes (read-only)"
                data-soap-reference="{&quot;status&quot;:&quot;available&quot;,&quot;withheld&quot;:true,&quot;notes&quot;:[{&quot;encounter&quot;:41,&quot;date&quot;:&quot;2026-09-01&quot;,&quot;sections&quot;:{&quot;subjective&quot;:&quot;&lt;script&gt;alert(1)&lt;\/script&gt;&quot;,&quot;objective&quot;:&quot;a &amp; &#039;b&#039;&quot;,&quot;assessment&quot;:&quot;&quot;,&quot;plan&quot;:&quot;line one\nline two&quot;}}]}"
                data-copy-eligibility="allowed"
                data-label-copy="Copy to current draft"
                data-label-copied="Copied into the current draft. Review before saving."
                data-label-locked="This field cannot be edited; nothing was copied."
                data-label-encounter="Encounter"
                data-label-subjective="Subjective"
                data-label-objective="Objective"
                data-label-assessment="Assessment"
                data-label-plan="Plan">
                <h3 class="oe-soap-reference__title">
                    <button type="button" class="btn btn-link oe-soap-reference__toggle" aria-expanded="false" aria-controls="oe-soap-reference-body">Previous SOAP notes</button>
                    <span class="badge badge-secondary">Read-only</span>
                </h3>
                <div id="oe-soap-reference-body" class="oe-soap-reference__body" hidden>
                    <p class="oe-soap-reference__status"
                        data-status-available="Read-only reference for this patient. Earlier notes cannot be edited here."
                        data-status-none="No earlier SOAP notes for this patient."
                        data-status-denied="Earlier SOAP notes are restricted for your account."
                        data-status-unavailable="Earlier SOAP notes could not be loaded."
                        data-status-withheld="Some earlier notes are hidden by access restrictions.">Earlier SOAP notes could not be loaded.</p>
                    <ol class="oe-soap-reference__list"></ol>
                    <p class="oe-soap-reference__live sr-only" aria-live="polite"></p>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const close = function() {
            if (top.isSoapEdit === true) {
                dlgopen('', '', 450, 125, '', '<div class="text-danger">Warning</div>',
                    {
                    type: 'Alert',
                    html: '<p>Do you want to close the tabs?</p>',
                    buttons: [
                        { text: 'Cancel', close: true, style: 'default btn-sm' },
                        { text: 'Close', close: true, style: 'danger btn-sm', click: closeSoap },
                    ],
                    allowDrag: false,
                    allowResize: false,
                });
            } else {
                top.restoreSession();
                location.href = 'javascript:parent.closeTab(window.name, false)';
            }
        }

        const closeSoap = function() {
            top.isSoapEdit = false;
            top.restoreSession();
            location.href = 'javascript:parent.closeTab(window.name, false)';
        }
        $('#btnClose').click(close);
    </script>

</body>
</html>
