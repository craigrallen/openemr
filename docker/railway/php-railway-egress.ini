; Railway test server: web-only PHP egress guard (TEST USE ONLY).
; Loaded by Apache via PHP_INI_SCAN_DIR from railway-serve.sh, after the CLI
; install/upgrade has run. Web requests may not open outbound connections,
; read URLs or spawn processes, so no module or core transport (SMTP,
; Twilio/FaxSMS, payment gateways, Direct, webhooks) can send anything.
; Database access (mysqli) is unaffected. Keeps upstream's pcntl list and
; must cover RAILWAY_WEB_DISABLED_FUNCTIONS in railway-safety.php. SOAP and
; Redis are excluded from this configuration by railway-web-ini.sh.
allow_url_fopen = Off
allow_url_include = Off
disable_functions = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client,socket_connect,socket_sendto,ftp_connect,ftp_ssl_connect,ldap_connect,mail,mb_send_mail,imap_open,imap_mail,stream_socket_server,socket_create,socket_sendmsg,exec,shell_exec,system,passthru,popen,proc_open
