# ============================================================================
# Railway test-server hardening (loaded after docker/release/openemr.conf)
# ============================================================================
# openemr.sh deletes the setup scripts after the first configuration, but the
# image copy comes back on every new container until that step runs. Deny the
# installer, multisite admin and upgrade/patch entry points over HTTP outright;
# upgrades still run through openemr.sh on the CLI.
<FilesMatch "^(setup|admin|auto_configure|sql_upgrade|sql_patch|acl_upgrade|ippf_upgrade|acl_setup|TEMPsql_upgrade)\.php$">
    Require all denied
</FilesMatch>

<FilesMatch "\.(sh|ini|source)$">
    Require all denied
</FilesMatch>

<Directory "/var/www/localhost/htdocs/openemr/contrib/util/installScripts">
    Require all denied
</Directory>
